<script>
  const fc = ["#ff7a45", "#16110e", "#7fa66b", "#9db7d6", "#6f6359", "#e8b45a"];
  const ft = ["$1 FOOD WEEK", "EASY BREAD", "3 MIN EGGS", "DORM CHEF", "", "PASTA HACK"];
  make("#co-feed", 6, (k) => ({ cls: "co-ft", id: "co-ft" + k, html: k === 4 ? '<div class="pl dull" style="left:160px;top:24px;width:244px;height:244px"><i></i><i></i><i></i></div>' : `<b>${ft[k]}</b>`, css: { left: (k % 3) * 550 + "px", top: Math.floor(k / 3) * 330 + 60 + "px", background: fc[k] } }));

  // k1
  on("#co-vb", C.k1 + 0.4, "pop");
  tl.fromTo("#co-ht", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, C.k1 - 0.3);
  words("#co-blend", C.k1 + 1.4);
  // k2: lost in a feed
  off("#co-blend", C.k2 - 0.2, "blur");
  tl.to(["#co-ht", "#co-vb"], { opacity: 0, scale: 0.9, duration: 0.3, ease: "power3.in" }, C.k2 - 0.1);
  tl.set("#co-feed", { opacity: 1 }, C.k2 + 0.1);
  q(".co-ft").forEach((el, k) => tl.fromTo(el, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" }, C.k2 + 0.1 + k * 0.06));
  tl.fromTo("#co-ft4", { scale: 1 }, { scale: 1.04, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", immediateRender: false }, C.k2 + 2.4);
  // k3: contrast swatches
  tl.to("#co-feed", { opacity: 0, duration: 0.3 }, C.k3 - 0.3);
  words("#co-k3", C.k3);
  tl.fromTo("#co-sw1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, C.k3 + 0.6);
  tl.fromTo("#co-swl1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.k3 + 0.7);
  tl.fromTo("#co-sw2", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, C.k3 + 2.2);
  tl.fromTo("#co-swl2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.k3 + 2.3);
  // k3b: warm on cool
  tl.to(["#co-sw1", "#co-sw2", "#co-swl1", "#co-swl2"], { opacity: 0, duration: 0.3 }, C.k3b - 0.35);
  off("#co-k3", C.k3b - 0.35, "blur");
  words("#co-warm", C.k3b);
  ["#co-ws1", "#co-ws2", "#co-ws3", "#co-ws4"].forEach((s, k) => tl.fromTo(s, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, C.k3b + 0.6 + k * 0.6));
  // k4: dark background, bright plate, clean edge
  off("#co-warm", C.k4 - 0.35, "up");
  tl.to(["#co-ws1", "#co-ws2", "#co-ws3", "#co-ws4"], { opacity: 0, duration: 0.3 }, C.k4 - 0.35);
  tl.to(["#co-ht", "#co-vb"], { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, C.k4 - 0.1);
  tl.to("#co-dark", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, C.k4 + 0.4);
  tl.to("#co-plb", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, C.k4 + 0.4);
  tl.fromTo("#co-edge", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, C.k4 + 2.2);
  // k5: black and white test
  tl.to(["#co-ht", "#co-vb"], { opacity: 0, duration: 0.3 }, C.k5 - 0.35);
  tl.fromTo("#co-bw", { opacity: 0 }, { opacity: 1, duration: 0.4 }, C.k5);
  // k6: light and dark mode
  tl.to("#co-bw", { opacity: 0, duration: 0.3 }, C.k6 - 0.35);
  tl.fromTo("#co-modes", { opacity: 0 }, { opacity: 1, duration: 0.3 }, C.k6);
  tl.fromTo("#co-m1", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, C.k6 + 0.6);
  tl.fromTo("#co-m2", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, C.k6 + 1.8);
</script>
