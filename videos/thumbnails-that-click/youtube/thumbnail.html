<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-700.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 760px 520px at 18% 0%, rgba(255, 180, 107, 0.28), rgba(255, 180, 107, 0) 70%),
      repeating-linear-gradient(176deg, rgba(0,0,0,0.07) 0 2px, rgba(0,0,0,0) 2px 9px, rgba(255,255,255,0.03) 9px 11px, rgba(0,0,0,0) 11px 23px),
      #3a2a20;
    font-family: "Archivo Black", sans-serif;
  }
  .l1 { position: absolute; left: 56px; top: 150px; font-size: 100px; line-height: 0.9; color: #f5f0e8; letter-spacing: -0.02em; }
  .l2 { position: absolute; left: 52px; top: 250px; font-size: 100px; line-height: 0.9; color: #ff5a1f; letter-spacing: -0.03em; }
  .l3 { position: absolute; left: 56px; top: 420px; font-size: 72px; line-height: 0.9; color: #f5f0e8; }
  .th { position: absolute; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 50px rgba(0,0,0,0.5); }
  .old { left: 780px; top: 60px; width: 400px; height: 225px; background: #6f6359; transform: rotate(-6deg); }
  .old svg { position: absolute; left: 90px; top: 30px; filter: blur(9px); }
  .new { left: 730px; top: 300px; width: 520px; height: 315px; background: #1f4e5a; transform: rotate(3deg); }
  .pl { position: absolute; border-radius: 50%; background: #fbf8f3; box-shadow: 0 0 0 8px #fbf8f3; }
  .pl i { position: absolute; border-radius: 50%; }
  .pl i:nth-child(1) { left: 16%; top: 20%; width: 40%; height: 32%; background: #ff5a1f; }
  .pl i:nth-child(2) { left: 48%; top: 38%; width: 32%; height: 29%; background: #e8b45a; }
  .pl i:nth-child(3) { left: 22%; top: 55%; width: 29%; height: 24%; background: #7fa66b; }
  .fc { position: absolute; border-radius: 50%; background: #ff5a1f; }
  .fc .e { position: absolute; top: 33%; width: 14%; height: 18%; border-radius: 50%; background: #16110e; }
  .fc .m { position: absolute; left: 38%; top: 58%; width: 24%; height: 27%; border-radius: 50%; background: #16110e; }
  .tx { position: absolute; right: 22px; top: 18px; text-align: right; font-size: 62px; line-height: 0.9; color: #fbf8f3; }
  .tx span { color: #ff5a1f; }
  .vb { position: absolute; padding: 8px 20px; border-radius: 12px; font-size: 44px; color: #16110e; }
  .vb1 { left: 770px; top: 30px; background: #8c7f73; transform: rotate(-6deg); }
  .vb10 { left: 720px; top: 560px; background: #ff5a1f; transform: rotate(3deg); }
  .arrow { position: absolute; left: 600px; top: 250px; }
</style>
</head>
<body>
  <div class="l1">FIX YOUR</div>
  <div class="l2">THUMBNAIL</div>
  <div class="l3">v1 → v10</div>
  <div class="th old"><svg width="220" height="160" viewBox="0 0 440 320"><circle cx="170" cy="160" r="130" fill="#2b211b" /><rect x="290" y="140" width="150" height="40" rx="20" fill="#2b211b" /></svg></div>
  <div class="th new">
    <div class="pl" style="left: 24px; top: 70px; width: 220px; height: 220px"><i></i><i></i><i></i></div>
    <div class="fc" style="left: 310px; top: 130px; width: 190px; height: 190px"><div class="e" style="left: 28%"></div><div class="e" style="left: 58%"></div><div class="m"></div></div>
    <div class="tx">ONLY <span>$3?</span></div>
  </div>
  <div class="vb vb1">v1</div>
  <div class="vb vb10">v10</div>
</body>
</html>
