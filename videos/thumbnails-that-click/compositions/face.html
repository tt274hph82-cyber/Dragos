// Wrap each word of the matched elements in <span class="w"> (keeps nested markup).
function split(sel) {
  q(sel).forEach((el) => {
    if (el.dataset.split) return;
    el.dataset.split = "1";
    const walk = (node) => {
      Array.from(node.childNodes).forEach((ch) => {
        if (ch.nodeType === 3) {
