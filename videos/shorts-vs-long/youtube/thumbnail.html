<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-700.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { position: relative; background: #0a1424; font-family: Inter, sans-serif; color: #fff; }
  .bl { position: absolute; border-radius: 50%; }
  .glass {
    position: absolute; border-radius: 34px; overflow: hidden;
    background: linear-gradient(140deg, rgba(255,255,255,0.28), rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.12));
    backdrop-filter: blur(26px) saturate(165%) brightness(0.8);
    border: 2px solid rgba(255,255,255,0.55);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.8), 0 26px 70px rgba(0,0,20,0.45);
  }
  .glass::before { content: ""; position: absolute; left: -10%; top: -60%; width: 80%; height: 120%; background: radial-gradient(ellipse, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%); }
  .scr { position: absolute; border-radius: 24px; overflow: hidden; background: #0d1b2a; }
  .egg { position: absolute; border-radius: 50%; background: #fbf8f3; }
  .egg::after { content: ""; position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; background: #ffb21f; }
  .plate { position: absolute; border-radius: 50%; background: #fbf8f3; }
  .plate i { position: absolute; border-radius: 50%; }
  .plate i:nth-child(1) { left: 16%; top: 20%; width: 40%; height: 32%; background: #ff5a1f; }
  .plate i:nth-child(2) { left: 48%; top: 38%; width: 32%; height: 29%; background: #e8b45a; }
  .plate i:nth-child(3) { left: 22%; top: 55%; width: 29%; height: 24%; background: #7fa66b; }
  .t { position: absolute; font-weight: 900; letter-spacing: -0.045em; line-height: 0.92; text-shadow: 0 6px 30px rgba(0,0,20,0.45); }
  .vs { position: absolute; left: 512px; top: 408px; width: 150px; height: 150px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 900; }
</style>
</head>
<body>
  <div class="bl" style="left: -200px; top: -260px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(63,224,208,0.95), rgba(63,224,208,0) 68%)"></div>
  <div class="bl" style="left: 700px; top: -200px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(255,90,31,0.95), rgba(255,90,31,0) 68%)"></div>
  <div class="bl" style="left: 380px; top: 360px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(255,61,127,0.8), rgba(255,61,127,0) 68%)"></div>

  <div class="t" style="left: 48px; top: 40px; font-size: 128px; color: #3fe0d0">SHORTS</div>
  <div class="t" style="left: 700px; top: 40px; font-size: 128px; color: #ff7a3d">LONG</div>

  <div class="glass" style="left: 150px; top: 190px; width: 270px; height: 500px; border-radius: 48px">
    <div class="scr" style="inset: 12px; border-radius: 38px; background: #12302e"><div class="egg" style="left: 63px; top: 170px; width: 120px; height: 120px"></div></div>
  </div>
  <div class="glass" style="left: 700px; top: 220px; width: 530px; height: 298px">
    <div class="scr" style="inset: 12px; background: #1a2a44"><div class="plate" style="left: 170px; top: 50px; width: 170px; height: 170px"><i></i><i></i><i></i></div></div>
  </div>
  <div class="glass vs">VS</div>
  <div class="t" style="left: 700px; top: 560px; font-size: 60px">Which grows<br />you faster?</div>
</body>
</html>
