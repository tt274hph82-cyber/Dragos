  #pl-week { position: absolute; left: 150px; top: 260px; width: 1620px; height: 520px; }
  .pl-d { position: absolute; top: 0; width: 214px; height: 520px; }
  .pl-d .dn { position: absolute; left: 24px; top: 20px; font-size: 38px; font-weight: 800; }
  .pl-j { position: absolute; left: 14px; right: 14px; top: 110px; height: 150px; border-radius: 22px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 34px; font-weight: 800; color: #0a1424; opacity: 0; }

<div class="disp t80 paper pn shadowed" id="pl-h">Maya's <span class="acc">weekly system</span></div>
<div id="pl-week"></div>
<svg id="pl-arc" viewBox="0 0 1620 120"></svg>
<div class="b56 paper pn shadowed" id="pl-tx">Every Sunday: which Shorts sent people to the long video?</div>
<div class="disp t110 paper pn shadowed" id="pl-four"><span class="acc">4 uploads</span> a week, from one filming day</div>

<script>
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const job = { 0: ["Long video", "#ff7a3d"], 1: ["Short", "#3fe0d0"], 3: ["Short", "#3fe0d0"], 5: ["Short", "#3fe0d0"] };
  const kind = { 1: "Hook", 3: "Tip", 5: "Result" };
  make("#pl-week", 7, (k) => ({
    cls: "glass pl-d", id: "pl-d" + k,
    html: `<div class="dn">${days[k]}</div>${job[k] ? `<div class="pl-j" id="pl-j${k}" style="background:${job[k][1]}">${job[k][0]}</div>` : ""}${kind[k] ? `<div class="pl-k glass pill" id="pl-k${k}" style="position:absolute">${kind[k]}</div>` : ""}${k === 6 ? '<div class="glass pill" id="pl-film" style="position:absolute">Film day</div>' : ""}`,
    css: { left: k * 234 + "px", opacity: 0 },
  }));
  const arc = document.getElementById("pl-arc");
  [1, 3, 5].forEach((k, j) => {
    const x0 = k * 234 + 107, x1 = 107;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    Object.entries({ id: "pl-a" + j, d: `M${x0} 110 C ${x0} 0, ${x1} 0, ${x1} 110`, pathLength: 100, stroke: "#ff7a3d", "stroke-width": 8, fill: "none", "stroke-linecap": "round", opacity: 0 }).forEach(([a, v]) => p.setAttribute(a, v));
    arc.appendChild(p);
  });

  words("#pl-h", C.p1);
  q(".pl-d").forEach((el, k) => gIn(el, C.p1 + 0.4 + k * 0.06));
  // p2: long video on Sunday
  tl.fromTo("#pl-j0", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, C.p2 + 0.4);
  // p3: three Shorts
  [[1, 1.6], [3, 2.6], [5, 3.6]].forEach(([k, dt]) => tl.fromTo("#pl-j" + k, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, C.p3 + dt));
  // p4: hook, tip, result
  [[1, 1.0], [3, 2.0], [5, 3.0]].forEach(([k, dt]) => tl.fromTo("#pl-k" + k, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, C.p4 + dt));
  // p5: same filming day
  tl.fromTo("#pl-film", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, C.p5 + 1.0);
  // p6: Sunday check
  off("#pl-h", C.p6 - 0.3, "up");
  [0, 1, 2].forEach((j) => { tl.set("#pl-a" + j, { opacity: 1 }, C.p6 + 1.6 + j * 0.3); draw("#pl-a" + j, C.p6 + 1.6 + j * 0.3, 0.6, "power2.out"); });
  words("#pl-tx", C.p6 + 0.3);
  // p6b
  off("#pl-tx", C.p6b - 0.3, "blur");
  q(".pl-d").forEach((el) => gOut(el, C.p6b - 0.3));
  tl.to("#pl-arc", { opacity: 0, duration: 0.25 }, C.p6b - 0.3);
  words("#pl-four", C.p6b + 0.1);
</script>
