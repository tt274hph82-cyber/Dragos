<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-700.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse 760px 520px at 18% 0%, rgba(255, 180, 107, 0.28), rgba(255, 180, 107, 0) 70%),
      repeating-linear-gradient(176deg, rgba(0,0,0,0.07) 0 2px, rgba(0,0,0,0) 2px 9px, rgba(255,255,255,0.03) 9px 11px, rgba(0,0,0,0) 11px 23px),
      #3a2a20;
    font-family: "Archivo Black", sans-serif;
  }
  .from { position: absolute; left: 56px; top: 70px; font-size: 92px; line-height: 0.9; color: #f5f0e8; letter-spacing: -0.02em; }
  .views { position: absolute; left: 50px; top: 170px; font-size: 196px; line-height: 0.86; color: #ff5a1f; letter-spacing: -0.04em; }
  .to { position: absolute; left: 56px; top: 560px; font-size: 92px; line-height: 0.9; color: #f5f0e8; letter-spacing: -0.02em; }
  .to span { color: #f5f0e8; }
  .card {
    position: absolute; left: 748px; top: 90px; width: 492px; height: 560px;
    background: #fbf8f3; border-radius: 30px; box-shadow: 0 24px 50px rgba(0,0,0,0.5);
    transform: rotate(3deg);
  }
  .card svg { position: absolute; left: 0; top: 0; }
  .avatar {
    position: absolute; left: 34px; top: 30px; width: 86px; height: 86px; border-radius: 50%;
    background: #ff5a1f; color: #16110e; display: flex; align-items: center; justify-content: center; font-size: 50px;
  }
  .chip {
    position: absolute; left: 136px; top: 44px; padding: 10px 22px; border-radius: 14px; background: #16110e; color: #8c7f73;
    font-family: Inter, sans-serif; font-weight: 700; font-size: 34px; text-decoration: line-through; text-decoration-color: #ff5a1f; text-decoration-thickness: 5px;
  }
</style>
</head>
<body>
  <div class="from">FROM</div>
  <div class="views">3<br />VIEWS</div>
  <div class="to">TO <span>GROWTH</span></div>
  <div class="card">
    <div class="avatar">M</div>
    <svg width="492" height="560" viewBox="0 0 520 560">
      <g stroke="#16110e" stroke-opacity="0.08" stroke-width="2">
        <path d="M40 200 H480 M40 280 H480 M40 360 H480 M40 440 H480" />
      </g>
      <path d="M40 160 V500 H480" stroke="#16110e" stroke-width="8" fill="none" stroke-linecap="round" />
      <path d="M60 470 C 150 465, 210 450, 270 390 S 380 230, 440 180" stroke="#ff5a1f" stroke-width="22" fill="none" stroke-linecap="round" />
      <path d="M392 164 L452 168 L438 226" stroke="#ff5a1f" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
</body>
</html>
