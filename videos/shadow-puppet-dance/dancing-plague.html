<title>The Dancing Plague</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=block">
<style>
  /* Layout: a dark stage; the 720x1280 screen scaled to fit with letterboxing, a slim control bar below. Single dark look by choice. */
  :root { --bg: #0d0604; --bar: #1c0f09; --ink: #f3e3c4; --dim: #b89571; --amber: #f2a85a; --rule: #3a2214; color-scheme: dark;
    --ui: "Libre Baskerville", Georgia, serif; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); margin: 0; display: grid; grid-template-rows: 1fr auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; box-sizing: border-box; }
  .stage { min-height: 0; display: grid; place-items: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; height: 100%; background: #000; display: block; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 4px 4px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  button { background: var(--bar); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; font: 13px var(--ui); padding: 7px 12px; cursor: pointer; min-width: 64px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--amber); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 88px; text-align: right; }
</style>
<div class="stage"><canvas id="screen" width="1080" height="1920" aria-label="The Dancing Plague, a shadow play"></canvas></div>
<div class="bar">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="45" step="0.01" value="0" aria-label="Scrub">
  <span class="time" id="time">0.0 / 45.0 s</span>
  <button id="snd" type="button" aria-pressed="true">Sound</button>
  <button id="loop" type="button" aria-pressed="true">Loop</button>
</div>
<script>// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();
</script>
<script>// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },

<script>// "The Dancing Plague" (Strasbourg, 1518) as a shadow play, 9:16, drawn natively at any size (720 x 1280 logical stage).

    causePlaque: 39.6, mark: 41.2, finalUp: [42.3, 42.7], finalCard: [42.5, 43.1],
  };
  const dayAt = (t) => 1 + Math.floor(5.999 * cl((t - T.days[0]) / (T.days[1] - T.days[0])));
  const countAt = (t) => Math.round(30 + 370 * EO(sm(T.count[0], T.count[1], t)));
  const danceAmt = (t) => sm(T.danceStart - 0.3, T.danceStart + 0.4, t) * (1 - 0.92 * sm(T.slow[0], T.slow[1], t));

  function sceneHook(st, t) {
    const hp = EIO(sm(T.cardHoist[0], T.cardHoist[1], t));
    if (hp >= 1) return;
    pup(st, {}, (p, g) => titleCard(p, g, {
      x: 360, y: lerp(lerp(-300, 560, EO(sm(T.cardDrop[0], T.cardDrop[1], t))), -500, hp), w: 600, h: 420, s: 1,
      rot: swing(t, T.cardDrop[1], 0.08, 2.2, 7),
      lines: [{ text: 'Strasbourg, 1518', size: 46, y: -112, italic: true }, { text: 'The Dancing', size: 76, y: -6 }, { text: 'Plague', size: 116, y: 112, italic: true }],
    }));
  }
  // the street: cathedral far off, houses, Frau Troffea steps out and starts to dance; days pass; others join; the crowd
  const JOIN = [[150, 0, 'm'], [600, 0.25, 'w'], [250, 0.5, 'w'], [520, 0.75, 'm'], [80, 1.0, 'w'], [660, 1.2, 'm']];
  function sceneStreet(st, t) {
    const gy = 1130;
    // the sky disc: sun and moon cycling through the days
    if (t > T.days[0] - 0.2 && t < T.days[1] + 0.6) pup(st, { blur: 1.2 }, (p, g) => {
      const u = cl((t - T.days[0]) / (T.days[1] - T.days[0])) * 6, f = u % 1, night = Math.floor(u * 2) % 2 === 1;
      const a = Math.PI * (1 - (u * 2) % 1);
      skyDisc(p, g, 360 + Math.cos(a) * 300, 720 - Math.sin(a) * 300, 40, night);
    });
    pup(st, { blur: 3.2, alpha: 0.45 }, (p, g) => cathedral(p, g, 470, 900, 0.95));
    pup(st, { blur: 1.6, alpha: 0.75 }, (p, g) => { [[70, 150, 300, 3], [215, 120, 250, 7], [350, 140, 330, 11], [520, 130, 270, 13], [655, 140, 310, 19]].forEach(([x, w, h, sd]) => house(p, g, x, 960, w, h, sd, t)); });
    // the crowd: blurred back rows bobbing
    const crowd = EO(sm(T.crowd[0], T.crowd[1], t));
    if (crowd > 0) pup(st, { blur: 2, alpha: 0.8 }, (p, g) => {
      const r = H.rng(5);
      for (let i = 0; i < 14; i++) { const x = 20 + i * 52 + r() * 20, ph = t * 7 + i * 1.3, hop = Math.abs(Math.sin(ph)) * 16; const y = gy - 120 + (1 - crowd) * 400 - hop;
        if (i % 2) woman(p, g, { x, y, s: 0.36, flip: i % 3 === 0, dance: 1, ph, noRods: true }, null);
        else man(p, g, { x, y, s: 0.36, flip: i % 3 === 0, walk: 1, ph, hat: 'cap', armR: 2.4 + Math.sin(ph) * 0.5, armL: 2.2 + Math.cos(ph) * 0.5, noRods: true }, null); }
    });
    // the people who joined
    pup(st, {}, (p, g, rods) => {
      JOIN.forEach(([x0, d, kind], i) => {
        const u = sm(T.joinIn[0] + d, T.joinIn[0] + d + 0.7, t);
        if (u <= 0) return;
        const ph = t * 7 + i * 1.7, hop = Math.abs(Math.sin(ph)) * 18 * u, x = lerp(x0 < 360 ? -160 : st.W + 160, x0, EO(u));
        if (kind === 'w') woman(p, g, { x, y: gy - 10 - hop, s: 0.5, flip: x0 > 360, dance: u, ph }, rods);
        else man(p, g, { x, y: gy - 10 - hop, s: 0.5, flip: x0 > 360, walk: 1, ph, hat: 'cap', armR: lerp(0.2, 2.5, u) + Math.sin(ph) * 0.5, armL: lerp(-0.1, 2.0, u) + Math.cos(ph) * 0.5 }, rods);
      });
    });
    // Frau Troffea, red gel in her skirt
    pup(st, {}, (p, g, rods) => {
      const u = EO(sm(T.womanIn[0], T.womanIn[1], t)), dn = danceAmt(t), ph = t * 7.5;
      woman(p, g, { x: lerp(-180, 380, u) + Math.sin(ph * 0.5) * 30 * dn, y: gy + 10 - Math.abs(Math.sin(ph)) * 22 * dn, s: 0.72, flip: Math.sin(ph * 0.25) < 0 && dn > 0.5, dance: dn, ph, armR: lerp(0.2, 2.6, dn), armL: lerp(-0.2, 2.2, dn), gel: 'rgb(240,60,46)' }, rods);
    });
    // labels
    pup(st, {}, (p, g) => {
      const up1 = 900 * EIO(sm(T.days[0] - 0.4, T.days[0] + 0.1, t));
      if (t > T.namePlaque && up1 < 890) plaque(p, { x: 360, y: lerp(-80, 300, EO(sm(T.namePlaque, T.namePlaque + 0.3, t))) - up1, text: 'Frau Troffea', size: 52, rot: swing(t, T.namePlaque + 0.3, 0.05, 3, 9), hang: 400 });
      const up2 = 900 * EIO(sm(T.joinIn[0] - 0.2, T.joinIn[0] + 0.3, t));
      if (t > T.daysBoard[0] && up2 < 890) board(p, { x: 360, y: lerp(-500, 330, EO(sm(T.daysBoard[0], T.daysBoard[1], t))) - up2, text: 'day ' + dayAt(t), size: 110, hw: 210, rot: swing(t, T.daysBoard[1], 0.04, 2.5, 7) });
      const up3 = 900 * EIO(sm(T.crowd[0] + 0.6, T.count[0], t));
      if (t > T.joinBoard[0] && up3 < 890) board(p, { x: 360, y: lerp(-500, 330, EO(sm(T.joinBoard[0], T.joinBoard[1], t))) - up3, text: '30+', size: 124, hw: 200, label: 'joined her', rot: swing(t, T.joinBoard[1], 0.04, 2.5, 7) });
      if (t > T.count[0] - 0.3) {
        const pop = t > T.countPop ? 1 + 0.12 * Math.exp(-(t - T.countPop) * 8) : 1;
        board(p, { x: 360, y: lerp(-500, 360, EO(sm(T.count[0] - 0.3, T.count[0], t))), text: String(countAt(t)), size: 150, hw: 220, pop, label: 'dancing', rot: swing(t, T.count[0], 0.04, 2.5, 7) });
      }
    });
  }
  // the doctors' cure, the stage and the band; it gets worse
  function sceneCure(st, t) {
    const gy = 1130;
    pup(st, { blur: 3.2, alpha: 0.45 }, (p, g) => cathedral(p, g, 470, 900, 0.95));
    pup(st, { blur: 1.6, alpha: 0.7 }, (p, g) => { [[70, 150, 300, 3], [215, 120, 250, 7], [520, 130, 270, 13], [655, 140, 310, 19]].forEach(([x, w, h, sd]) => house(p, g, x, 960, w, h, sd, t)); });
    const su = EO(sm(T.stageUp[0], T.stageUp[1], t)), sy = gy - 20 + (1 - su) * 400, sh = 150;
    if (su > 0) pup(st, {}, (p) => stage(p, 380, sy, 520, sh));
    // dancers on the stage, faster; two collapse
    pup(st, {}, (p, g, rods) => {
      const on = sm(T.stageUp[0], T.stageUp[1], t);
      [[250, 'w', T.fall1], [400, 'm', null], [530, 'w', T.fall2]].forEach(([x, k, fl], i) => {
        const ph = t * (t > T.bandIn[1] ? 10 : 7) + i * 1.9, f = fl ? EO(sm(fl[0], fl[1], t)) : 0, hop = Math.abs(Math.sin(ph)) * 20 * (1 - f);
        const y = (su > 0 ? sy - sh : gy) - hop;
        if (k === 'w') woman(p, g, { x, y, s: 0.5, flip: i === 2, dance: (1 - f) * (on > 0 ? 1 : 0.6), ph, fall: f, armR: 2.2 * (1 - f), armL: 1.8 * (1 - f), gel: i === 0 ? 'rgb(240,60,46)' : null }, rods);
        else man(p, g, { x, y, s: 0.5, walk: 1, ph, hat: 'cap', armR: 2.5 + Math.sin(ph) * 0.5, armL: 2.0 + Math.cos(ph) * 0.5 }, rods);
      });
    });
    // the band
    const bu = EO(sm(T.bandIn[0], T.bandIn[1], t));
    if (bu > 0) pup(st, {}, (p, g, rods) => {
      const beat = Math.max(0, Math.sin(t * 4 * Math.PI));
      man(p, g, { x: lerp(-160, 90, bu), y: gy + 20, s: 0.5, hat: 'cap', armR: 1.3, armL: 0.6, noRods: false }, rods);
      tabor(p, lerp(-160, 90, bu) + 50, gy + 20 - 170, beat);
      man(p, g, { x: lerp(st.W + 160, 650, bu), y: gy + 20, s: 0.5, hat: 'cap', flip: true, armR: 1.75, armL: 1.6, noRods: false }, rods);
      p.save(); p.translate(lerp(st.W + 160, 650, bu) - 46, gy + 20 - 196); p.rotate(-0.55); p.fillStyle = INK; p.fillRect(-4, -4, 110, 8); p.beginPath(); p.moveTo(104, -6); p.lineTo(124, -14); p.lineTo(124, 14); p.lineTo(104, 6); p.fill(); cut(p, () => { for (let k = 0; k < 5; k++) dot(p, 30 + k * 14, 0, 2); }); p.restore();
    });
    // the doctors, before the stage arrives
    const du = EO(sm(T.doctorsIn[0], T.doctorsIn[1], t)), dout = EIO(sm(T.stageUp[0] - 0.3, T.stageUp[0] + 0.3, t));
    if (dout < 1) pup(st, {}, (p, g, rods) => {
      man(p, g, { x: lerp(-200, 230, du) - dout * 500, y: gy + 20, s: 0.7, walk: 1 - du, ph: t * 8, hat: 'doctor', robe: true, beard: true, armR: 1.1 + Math.sin(t * 3) * 0.1, armL: 0.1 }, rods);
      man(p, g, { x: lerp(st.W + 200, 520, du) + dout * 500, y: gy + 20, s: 0.66, flip: true, walk: 1 - du, ph: t * 8 + 1, hat: 'doctor', robe: true, armR: 0.5, armL: -0.1, roll: true }, rods);
    });
    pup(st, {}, (p, g) => {
      const up = 900 * EIO(sm(T.stageUp[0] - 0.2, T.stageUp[0] + 0.4, t));
      if (t > T.curePlaque && up < 890) plaque(p, { x: 360, y: lerp(-80, 280, EO(sm(T.curePlaque, T.curePlaque + 0.3, t))) - up, text: "the doctors' cure:", size: 50, rot: swing(t, T.curePlaque + 0.3, 0.05, 3, 9), hang: 400 });
      if (t > T.cureTag && up < 890) tag(p, g, { x: 380, y: lerp(-80, 380, EO(sm(T.cureTag, T.cureTag + 0.25, t))) - up, w: 420, h: 96, text: 'more dancing!', size: 56, rot: swing(t, T.cureTag + 0.25, 0.08, 2.5, 8) });
      const up2 = 900 * EIO(sm(T.worse - 0.3, T.worse + 0.2, t));
      if (t > T.bandPlaque && up2 < 890) plaque(p, { x: 360, y: lerp(-80, 300, EO(sm(T.bandPlaque, T.bandPlaque + 0.3, t))) - up2, text: 'a stage and a band', size: 48, rot: swing(t, T.bandPlaque + 0.3, 0.05, 3, 9), hang: 400 });
      if (t > T.worseTag) tag(p, g, { x: 360, y: lerp(-80, 330, EO(sm(T.worseTag, T.worseTag + 0.25, t))), w: 320, h: 96, text: 'worse', size: 60, tx: -36, rot: swing(t, T.worseTag + 0.25, 0.1, 2.5, 8), badge: 'x', badgeS: EO(sm(T.worseTag + 0.25, T.worseTag + 0.4, t)) * 0.95 });
    });
  }
  // the mountain shrine: the dancers are led up the path; slowly the dancing stops; nobody knows why
  function sceneShrine(st, t) {
    const gy = 1130;
    pup(st, {}, (p, g) => moon(p, g, { x: 600, y: 230, r: 52, burst: EO(sm(T.finalCard[1], T.finalCard[1] + 0.4, t)) * 0.8 }));
    pup(st, { blur: 1.4 + 3 * sm(T.causePlaque, T.mark, t), alpha: 0.85 - 0.62 * sm(T.causePlaque, T.mark, t) }, (p, g) => shrineHill(p, g, st.W, 1010, t));
    // the procession: small figures climbing the path
    const path = [[40, 1000], [320, 950], [200, 810], [110, 690], [330, 570]];
    const along = (u) => { const n = path.length - 1, i = Math.min(n - 1, Math.floor(u * n)), f = u * n - i; return [lerp(path[i][0], path[i + 1][0], f), lerp(path[i][1], path[i + 1][1], f)]; };
    pup(st, { blur: 1.4, alpha: 0.9 }, (p, g) => {
      for (let i = 0; i < 6; i++) {
        const u = cl((t - T.procession[0]) / (T.procession[1] - T.procession[0]) * 0.8 - i * 0.07 + 0.08);
        if (u <= 0 || u >= 1) continue;
        const [x, y] = along(u), s = 0.2 - u * 0.07;
        if (i % 2) woman(p, g, { x, y, s, dance: 0.4, ph: t * 6 + i, noRods: true }, null);
        else man(p, g, { x, y, s, walk: 1, ph: t * 6 + i, hat: 'cap', noRods: true }, null);
      }
    });
    // Frau Troffea in front, her dance winding down to stillness
    pup(st, {}, (p, g, rods) => {
      const dn = danceAmt(t), ph = t * 6;
      woman(p, g, { x: 520, y: gy + 10 - Math.abs(Math.sin(ph)) * 18 * dn, s: 0.7, flip: true, dance: dn, ph, armR: lerp(-0.1, 2.4, dn), armL: lerp(-0.2, 2.0, dn), gel: 'rgb(240,60,46)' }, rods);
    });
    const up = 1000 * EIO(sm(T.finalUp[0], T.finalUp[1], t));
    pup(st, {}, (p, g) => {
      const up0 = 900 * EIO(sm(T.slow[0], T.slow[0] + 0.5, t));
      if (t > T.shrinePlaque && up0 < 890) plaque(p, { x: 360, y: lerp(-80, 250, EO(sm(T.shrinePlaque, T.shrinePlaque + 0.3, t))) - up0, text: 'shrine of St. Vitus', size: 48, rot: swing(t, T.shrinePlaque + 0.3, 0.05, 3, 9), hang: 400 });
      if (up < 990) {
        if (t > T.causePlaque) plaque(p, { x: 400, y: lerp(-80, 260, EO(sm(T.causePlaque, T.causePlaque + 0.3, t))) - up, text: 'the cause', size: 52, rot: swing(t, T.causePlaque + 0.3, 0.05, 3, 9), hang: 400 });
        if (t > T.mark - 0.05) {
          const hit = Math.exp(-Math.max(0, t - T.mark) * 5), land = EO(sm(T.mark - 0.05, T.mark + 0.15, t));
          // a ring with a solid ? inside; the hill has faded back behind it
          p.save(); p.translate(400, 500 - up); const sc = lerp(1.7, 1, land) * (1 + hit * 0.12); p.scale(sc, sc); p.globalAlpha = land;
          p.fillStyle = INK; p.strokeStyle = INK; p.lineWidth = 16; p.beginPath(); p.arc(0, 0, 124, 0, TAU); p.stroke(); for (let k = 0; k < 24; k++) dot(p, Math.cos(k * TAU / 24) * 128, Math.sin(k * TAU / 24) * 128, 9);
          cut(p, () => { for (let k = 0; k < 24; k++) dot(p, Math.cos((k + 0.5) * TAU / 24) * 124, Math.sin((k + 0.5) * TAU / 24) * 124, 2.6); });
          p.font = `italic 400 250px ${FF}`; p.textAlign = 'center'; p.textBaseline = 'middle'; p.fillText('?', 0, 14);
          p.restore();
        }
      }
      if (t > T.finalCard[0]) titleCard(p, g, { x: 360, y: lerp(-300, 600, EO(sm(T.finalCard[0], T.finalCard[1], t))), w: 600, h: 380, s: 1, rot: swing(t, T.finalCard[1], 0.06, 2.2, 6),
        lines: [{ text: 'The Dancing Plague', size: 64, y: -54 }, { text: '1518', size: 72, y: 34, num: true }, { text: 'still unexplained', size: 46, y: 104, italic: true }] });
    });
  }

  function drawAt(ctx, PW, PH, t) {
    K = PW / 720; const W = 720, Hh = 1280;
    ctx.setTransform(K, 0, 0, K, 0, 0);
    const st = begin(W, Hh);
    let b = sm(0, 0.55, t) * (1 - 0.35 * Math.max(0, NZ.n2(t * 23, 3.3)) * (1 - sm(0.35, 0.7, t)));
    b *= 1 - 0.93 * Math.sin(Math.PI * cl((t - T.lampDown[0]) / (T.lampDown[1] - T.lampDown[0])));
    // days and nights: the lamp dips each "night" while the days board counts
    if (t > T.days[0] && t < T.days[1]) { const u = (t - T.days[0]) / (T.days[1] - T.days[0]) * 6; b *= 1 - 0.42 * (Math.floor(u * 2) % 2); }
    const flare = Math.max(t > T.countPop ? Math.exp(-(t - T.countPop) * 3) * 0.3 : 0, t > T.mark ? Math.exp(-(t - T.mark) * 3) * 0.3 : 0);
    lamp(ctx, W, Hh, t, b + flare * 0.3, flare);
    const red = sm(T.worse, T.worse + 0.3, t) * (1 - sm(T.lampDown[0] - 0.4, T.lampDown[0], t));
    if (red > 0) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(255,70,50,${red * 0.55})`; ctx.fillRect(0, 0, W, Hh); ctx.restore(); }
    if (t > 31.7) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(150,170,255,0.34)'; ctx.fillRect(0, 0, W, Hh); ctx.restore(); }
    if (t < 19.85) { if (t > 2.7) sceneStreet(st, t); sceneHook(st, t); }
    else if (t < 31.7) sceneCure(st, t);
    else sceneShrine(st, t);
    const s = st.S.getContext('2d');
    s.drawImage(valance(W), 0, 0, W, 80); s.drawImage(ground(W), 0, Hh - 110, W, 110);
    const cover = EIO(sm(T.curtains[0], T.curtains[1], t)) * (1 - EIO(sm(T.curtains[2], T.curtains[3], t)));
    if (cover > 0.001) pup(st, {}, (p) => curtains(p, W, Hh, cover, t));
    end(ctx, st, t);
  }
  function explainer(ctx, W, Hh, t) { drawAt(ctx, W, Hh, t); }

  window.DANCE = { explainer, D, T, dayAt, countAt, fonts: ['400 132px "Libre Baskerville"', '400 70px "IM Fell English"', 'italic 400 44px "IM Fell English"'] };
})();
</script>
<script>// The sound score for the shadow-play Dancing Plague. Cues read the picture's beat times (DANCE.T), which follow
// Austin's lines. Palette: struck bronze, wooden rod taps, hide rustle, the lamp's hum; a small tabor-and-pipe tune
// for the band; one gong for 400 and one for the ?. Kept well under the narration (voiceover mode).
(function () {
  const T = DANCE.T, D = DANCE.D;
  function scoreSound(k) {
    const gam = (t, n, g = 1, pan = 0, minor = false) => {
      const f = k.hz(n);
      k.tone(t, { f, dur: 1.9, gain: 0.13 * g, a: 0.002, pan, verb: 0.3, minor });
      k.tone(t, { f: f * 1.007, dur: 1.6, gain: 0.07 * g, a: 0.002, pan, verb: 0.3, minor });
      k.tone(t, { f: f * 2.01, dur: 0.55, gain: 0.04 * g, a: 0.002, pan, minor });
      if (f * 2.95 < 2500) k.tone(t, { f: f * 2.95, dur: 0.22, gain: 0.018 * g, a: 0.002, pan, minor });
      k.noise(t, { dur: 0.02, filter: 'bandpass', f: Math.min(2200, f * 1.6), q: 2, gain: 0.08 * g, pan, minor });
    };
    const gong = (t, g = 1) => {
      k.play('thud', t, { f: 90, gain: 0.7 * g });
      k.tone(t, { f: [[0, 98], [3.6, 95]], dur: 3.6, gain: 0.36 * g, a: 0.012, verb: 0.45 });
      k.tone(t, { f: [[0, 99.2], [3.2, 96]], dur: 3.2, gain: 0.16 * g, a: 0.02 });
      k.tone(t, { f: 202, dur: 2.2, gain: 0.1 * g, a: 0.01, verb: 0.4 });
      k.noise(t, { dur: 0.3, color: 'brown', filter: 'lowpass', f: 450, gain: 0.3 * g });
    };
    const tap = (t, f = 640, g = 0.55, pan = 0, minor = true) => { k.play('tock', t, { f, gain: g, pan, minor }); k.noise(t, { dur: 0.014, filter: 'bandpass', f: 1700, q: 2.5, gain: 0.32 * g, a: 0.001, pan, minor }); };
    const hide = (t, dur, g = 0.5, pan = 0) => k.play('paper', t, { dur, gain: g, pan, minor: true });
    const slide = (t, dur, g = 0.12) => k.noise(t, { dur, color: 'brown', filter: 'lowpass', f: [[0, 260], [dur * 0.5, 520], [dur, 240]], gain: g, a: dur * 0.4, minor: true });
    const sigh = (t) => k.noise(t, { dur: 0.8, color: 'brown', filter: 'lowpass', f: [[0, 600], [0.4, 140], [0.8, 600]], gain: 0.35, a: 0.05, hold: 0.5 });
    const jingle = (t, g = 0.06, pan = 0) => { for (let i = 0; i < 4; i++) k.noise(t + i * 0.018, { dur: 0.05, filter: 'bandpass', f: 4200 + i * 500, q: 5, gain: g, pan, minor: true }); };
    // dancing feet: light wooden taps on the beat; `rate` taps a second; amplitude follows the dance
    const feet = (a, b, rate, g, pan, fade) => { for (let t = a, i = 0; t < b; t += 1 / rate, i++) { const amp = fade ? fade(t) : 1; if (amp > 0.05) tap(t, 820 + (i % 2) * 140, g * amp, pan + (i % 2 ? 0.1 : -0.1)); } };
    const danceAmt = (t) => H.smooth(T.danceStart - 0.3, T.danceStart + 0.4, t) * (1 - 0.92 * H.smooth(T.slow[0], T.slow[1], t));
    const ticks = (f, a, b) => { let last = -1, prev = f(a); for (let t = a; t < b; t += 0.002) { const v = f(t); if (v !== prev && t - last >= 0.09) { tap(t, 1150, 0.34); last = t; } prev = v; } };

    // ---- beds
    k.bed('hum', 0.2, D, { gain: 0.5 });
    k.bed('room', 0, D, { gain: 0.7 });
    k.noise(0.04, { dur: 0.45, color: 'brown', filter: 'lowpass', f: [[0, 200], [0.12, 700], [0.45, 180]], gain: 0.4, a: 0.05 });
    [0.18, 0.31, 0.47].forEach((t, i) => k.noise(t, { dur: 0.012, filter: 'bandpass', f: 1300 + i * 300, q: 1.5, gain: 0.12, minor: true }));

    // ---- 1 HOOK
    hide(0.25, 0.3, 0.7);
    tap(T.cardDrop[1], 520, 0.7, 0, false);
    gam(T.cardDrop[1] + 0.02, 'D4', 1.0);
    slide(T.cardHoist[0], 0.6, 0.14);

    // ---- 2 FRAU TROFFEA walks in, then dances
    for (let t = T.womanIn[0] + 0.1; t < T.womanIn[1]; t += 0.32) tap(t, 360, 0.35, -0.4);
    tap(T.namePlaque + 0.3, 860, 0.5);
    jingle(T.danceStart, 0.1);
    feet(T.danceStart, T.joinIn[0], 3, 0.32, 0, danceAmt);

    // ---- 3 DAYS: a soft chime at each dawn
    for (let d = 0; d < 6; d++) gam(T.days[0] + d * (T.days[1] - T.days[0]) / 6, d % 2 ? 'A4' : 'E4', 0.35, 0.4, true);
    tap(T.daysBoard[1], 520, 0.55, 0, false);

    // ---- 4 THIRTY JOIN: more feet, the board
    feet(T.joinIn[0], T.crowd[0], 5, 0.3, 0.2);
    tap(T.joinBoard[1], 520, 0.6, 0, false);
    gam(T.joinBoard[1] + 0.02, 'A3', 0.8);

    // ---- 5 FOUR HUNDRED: crowd rattle rising, count ticks, gong
    feet(T.crowd[0], T.curtains[0], 7, 0.26, -0.1);
    k.noise(T.crowd[0], { dur: T.countPop - T.crowd[0], color: 'pink', filter: 'bandpass', f: [[0, 400], [T.countPop - T.crowd[0], 1400]], q: 0.8, gain: 0.1, a: 2.5, minor: true });
    ticks(DANCE.countAt, T.count[0] + 0.05, T.count[1] - 0.02);
    gong(T.countPop + 0.05, 1.0);

    // ---- 6 CURTAINS, the doctors
    for (const pan of [-0.7, 0.7]) k.noise(T.curtains[0], { dur: 0.32, color: 'pink', filter: 'bandpass', f: [[0, 500], [0.2, 1500], [0.32, 700]], q: 0.7, gain: 0.25, a: 0.12, pan });
    k.play('thud', T.curtains[1], { f: 110, gain: 0.3 });
    for (const pan of [-0.7, 0.7]) k.noise(T.curtains[2], { dur: 0.36, color: 'pink', filter: 'bandpass', f: [[0, 700], [0.2, 1500], [0.36, 500]], q: 0.7, gain: 0.22, a: 0.12, pan });
    for (let t = T.doctorsIn[0]; t < T.doctorsIn[1]; t += 0.3) tap(t, 300, 0.35, 0);
    tap(T.curePlaque + 0.3, 860, 0.5);
    tap(T.cureTag + 0.25, 640, 0.6, 0, false);
    gam(T.cureTag + 0.3, 'E5', 0.6);

    // ---- 7 THE STAGE AND THE BAND: a tabor beat and a little pipe tune until it goes wrong
    k.play('thud', T.stageUp[1], { f: 120, gain: 0.4 });
    const tune = ['D5', 'E5', 'F#5', 'A5', 'F#5', 'E5', 'D5', 'A4'];
    for (let t = T.bandIn[1], i = 0; t < T.worse; t += 0.25, i++) {
      tap(t, i % 2 ? 300 : 220, 0.32, -0.5);
      if (i % 2 === 0) k.tone(t, { f: tune[(i / 2) % tune.length], dur: 0.22, gain: 0.035, a: 0.02, pan: 0.5, minor: true });
    }
    feet(T.bandIn[1], T.worse, 6, 0.22, 0.1);
    tap(T.bandPlaque + 0.3, 860, 0.5);

    // ---- 8 WORSE: clash, the music stops, two dancers fall
    gam(T.worse + 0.02, 'Eb4', 0.8); gam(T.worse + 0.02, 'E4', 0.7); gam(T.worse + 0.02, 'A2', 0.9);
    tap(T.worseTag + 0.25, 640, 0.6, 0, false);
    feet(T.worse + 0.3, T.lampDown[0], 3, 0.2, 0, (t) => 1 - H.smooth(T.worse, T.lampDown[0], t));
    k.play('thud', T.fall1[1], { f: 80, gain: 0.5, pan: -0.3 });
    k.play('thud', T.fall2[1], { f: 75, gain: 0.5, pan: 0.3 });

    // ---- 9 THE SHRINE: lamp sigh, slow steps, a distant bell
    sigh(T.lampDown[0]);
    for (let t = T.procession[0], i = 0; t < T.procession[1]; t += 0.55, i++) tap(t, 260, 0.18, -0.3 + (i % 2) * 0.1);
    [T.procession[0] + 0.6, T.procession[0] + 2.4].forEach((t) => { k.tone(t, { f: 'A4', dur: 2.2, gain: 0.05, a: 0.002, verb: 0.6, minor: true }); k.tone(t, { f: 1240, dur: 1.2, gain: 0.02, a: 0.002, verb: 0.6, minor: true }); });
    tap(T.shrinePlaque + 0.3, 860, 0.5);

    // ---- 10 SHE SLOWS AND STOPS
    feet(T.slow[0] - 0.4, T.slow[1], 3, 0.3, 0.3, (t) => danceAmt(t));

    // ---- 11 THE CAUSE: the ?
    tap(T.causePlaque + 0.3, 860, 0.5);
    gong(T.mark + 0.04, 1.0);
    gam(T.mark + 0.06, 'C#5', 0.45, 0.3);

    // ---- 12 TAKEAWAY
    slide(T.finalUp[0], 0.4, 0.1);
    hide(T.finalCard[0], 0.3, 0.6);
    tap(T.finalCard[1], 520, 0.8, 0, false);
    gam(T.finalCard[1] + 0.1, 'D4', 0.9, -0.2); gam(T.finalCard[1] + 0.24, 'A4', 0.85, 0); gam(T.finalCard[1] + 0.38, 'D5', 0.8, 0.2);
    k.tone(T.finalCard[1] + 0.1, { f: 'D3', dur: 2.4, gain: 0.12, a: 0.01, verb: 0.4 });
  }
  window.scoreSound = scoreSound;
})();

<script>
const DURATION = DANCE.D; window.DURATION = DURATION;
const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
const playB = document.getElementById('play'), scrub = document.getElementById('scrub'), timeL = document.getElementById('time'), sndB = document.getElementById('snd'), loopB = document.getElementById('loop');
let t = 0, playing = false, t0 = 0, wall0 = 0, soundOn = true, loop = true, stopSound = null, raf = 0;
function draw(tt) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; DANCE.explainer(ctx, 1080, 1920, tt); }
window.seek = (tt) => { t = Math.max(0, Math.min(DURATION, tt)); draw(t); scrub.value = t; timeL.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)} s`; };
// narration: Austin's lines, decoded once and scheduled on their own context in sync with the score
let voBufs = null, voCtx = null;
async function voLoad(ctx) {
  if (voBufs) return voBufs;
  voBufs = await Promise.all(window.VO.map(async (v) => { const bin = Uint8Array.from(atob(v.b64), (c) => c.charCodeAt(0)); return ctx.decodeAudioData(bin.buffer); }));
  return voBufs;
}
function stopVO() { if (voCtx) { try { voCtx.close(); } catch (e) {} voCtx = null; } }
async function startVO(from) {
  stopVO(); const ctx = (voCtx = new (window.AudioContext || window.webkitAudioContext)()), bufs = await voLoad(ctx);
  if (ctx !== voCtx) return;
  const base = ctx.currentTime + 0.03;
  window.VO.forEach((v, i) => {
    if (v.start + v.dur <= from) return;
    const src = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 1.0; src.buffer = bufs[i]; src.connect(g); g.connect(ctx.destination);
    if (v.start >= from) src.start(base + (v.start - from)); else src.start(base, from - v.start);
  });
}
function stopS() { if (stopSound) { stopSound(); stopSound = null; } stopVO(); }
function startS() { stopS(); if (soundOn && playing) { stopSound = SOUND.live(window.scoreSound, t, { voiceover: true }); startVO(t); } }
function tick() {
  if (!playing) return;
  let tt = t0 + (performance.now() - wall0) / 1000;
  if (tt >= DURATION) { if (loop) { t0 = 0; wall0 = performance.now(); tt = 0; window.seek(0); startS(); } else { window.seek(DURATION); pause(); return; } }
  window.seek(tt); raf = requestAnimationFrame(tick);
}
function play() { if (t >= DURATION - 0.01) t = 0; playing = true; t0 = t; wall0 = performance.now(); playB.textContent = 'Pause'; startS(); raf = requestAnimationFrame(tick); }
function pause() { playing = false; cancelAnimationFrame(raf); stopS(); playB.textContent = 'Play'; }
playB.onclick = () => (playing ? pause() : play());
scrub.oninput = () => { const was = playing; if (was) { playing = false; cancelAnimationFrame(raf); stopS(); } window.seek(+scrub.value); if (was) play(); };
sndB.onclick = () => { soundOn = !soundOn; sndB.setAttribute('aria-pressed', soundOn); if (!soundOn) stopS(); else startS(); };
loopB.onclick = () => { loop = !loop; loopB.setAttribute('aria-pressed', loop); };
(async () => { try { await Promise.all(DANCE.fonts.map((f) => document.fonts.load(f, 'AaZz09'))); await document.fonts.ready; } catch (e) {} window.seek(6.5); window.__ready = true; })();
</script>
