<title>The Great Emu War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=block">
<style>
  /* Layout: a dark stage; the 720x1280 screen scaled to fit with letterboxing, a slim control bar below. Single dark look by choice. */
  :root { --bg: #0d0604; --bar: #1c0f09; --ink: #f3e3c4; --dim: #b89571; --amber: #f2a85a; --rule: #3a2214; color-scheme: dark;
    --ui: "Libre Baskerville", Georgia, serif; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--ui); margin: 0; display: grid; grid-template-rows: 1fr auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; box-sizing: border-box; }
  .stage { min-height: 0; display: grid; place-items: center; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 9 / 16; height: 100%; background: #000; display: block; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 4px 4px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  button { background: var(--bar); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; font: 13px var(--ui); padding: 7px 12px; cursor: pointer; min-width: 64px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button[aria-pressed="true"] { color: var(--amber); border-color: var(--amber); }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--amber); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; min-width: 88px; text-align: right; }
</style>
<div class="stage"><canvas id="screen" width="720" height="1280" aria-label="The Great Emu War, a shadow play"></canvas></div>
<div class="bar">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="32" step="0.01" value="0" aria-label="Scrub">
  <span class="time" id="time">0.0 / 32.0 s</span>
  <button id="snd" type="button" aria-pressed="true">Sound</button>
  <button id="loop" type="button" aria-pressed="true">Loop</button>
</div>
<script>// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();
</script>
<script>// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },

  // The Lewis gun on its bipod: finned barrel shroud, round pan magazine with punched spokes, wooden stock.
  // o: x,y,s, rot, fire (0..1 flash), jam (0..1 smoke), pan (rotation)
  function lewis(p, g, o, rods) {
    both([p, g], (c) => { c.save(); c.translate(o.x, o.y); c.rotate(o.rot || 0); c.scale(o.s, o.s); });
    p.fillStyle = INK; p.strokeStyle = INK; p.lineCap = 'round';

    p.fillRect(-60, 18, 20, 44);
    p.lineWidth = 8; p.beginPath(); p.moveTo(160, 6); p.lineTo(120, 140); p.moveTo(160, 6); p.lineTo(210, 140); p.stroke();

    pin(p, 0, 0, 7);
    both([p, g], (c) => c.restore());

    if ((o.fire || 0) > 0.02) {
      const f = o.fire, r = 48 * f;

      for (let k = 0; k < 8; k++) tear(p, 0, 0, r * (k % 2 ? 0.7 : 1.3), 18 * f, k * TAU / 8);

        p.restore();

  }
  // A 1930s army truck (open tray), wheels with punched spokes that turn. Wheels sit on y = 0. o: x,y,s,spin,tilt
  function truck(p, g, o, rods) {

    p.fillStyle = INK; p.strokeStyle = INK;

  // A cut-hide wheat crop along the bottom, ears swaying; `eaten` gnaws gaps into it.

    p.fillStyle = INK; p.strokeStyle = INK; p.lineCap = 'round';
    for (let x = -10; x < W + 10; x += 18 + r() * 10) {

  // the outback skyline: low hills, a windmill whose sails turn, a fence (cut from one long strip)
  function outback(p, W, Hh, t, gy) {
    p.fillStyle = INK; p.strokeStyle = INK;
    p.beginPath(); p.moveTo(0, gy); p.quadraticCurveTo(140, gy - 70, 300, gy - 30); p.quadraticCurveTo(460, gy + 4, 560, gy - 50); p.quadraticCurveTo(650, gy - 90, W, gy - 40); p.lineTo(W, gy + 20); p.lineTo(0, gy + 20); p.fill();

    p.lineWidth = 6; p.beginPath(); p.moveTo(mx - 40, gy - 40); p.lineTo(mx, my); p.lineTo(mx + 40, gy - 50); p.stroke();

    for (let k = 0; k < 12; k++) { p.save(); p.rotate(k * TAU / 12); p.beginPath(); p.moveTo(6, -5); p.lineTo(60, -11); p.lineTo(60, 11); p.lineTo(6, 5); p.fill(); p.restore(); }

    p.beginPath(); p.moveTo(mx + 6, my); p.lineTo(mx + 70, my - 14); p.lineTo(mx + 84, my + 14); p.closePath(); p.fill();

    p.lineWidth = 3; for (let x = 20; x < W; x += 70) p.fillRect(x, gy - 46, 8, 50);
    p.beginPath(); p.moveTo(0, gy - 36); p.lineTo(W, gy - 36); p.moveTo(0, gy - 16); p.lineTo(W, gy - 16); p.stroke();
  }

  // the wheat field: emus hop in on their rods and eat; the counter board counts them
  const EMUS = [{ x: 470, d: 0 }, { x: 610, d: 0.25 }, { x: 340, d: 0.5 }, { x: 210, d: 0.75 }, { x: 560, d: 1.0 }];

  // the army: the soldier slides in with his gun; then the guns fire and the emus scatter in small groups

  // the transition: an emu runs right at the lamp; its shadow swells until it fills the screen

  // the tally: bullets and kills count up, a vine divides them, and "10 per bird" lands with a gong
  function sceneTally(st, t) {
    pup(st, {}, (p, g, rods) => {
      board(p, { x: 360, y: 380, text: fmt(countBullets(t)), size: 128, label: 'bullets fired', rot: swing(t, T.bulletsCount[0], 0.04, 2.5, 7) * 0 + Math.sin(t * 1.3) * 0.01 });
      if (t > T.killsCount[0] - 0.25) board(p, { x: 360, y: lerp(-400, 650, EO(sm(T.killsCount[0] - 0.25, T.killsCount[0], t))), text: fmt(countKills(t)), size: 128, label: 'emus reported killed', rot: swing(t, T.killsCount[0], 0.04, 2.5, 7) });
      const vp = EIO(sm(T.divide[0], T.divide[1], t));
      vine(p, [[620, 380], [700, 520], [700, 760], [560, 860]], vp, 7);
      vine(p, [[100, 650], [40, 760], [80, 840], [180, 880]], vp, 7);
    });
    if (t > T.ten - 0.05) {
      const hit = Math.exp(-Math.max(0, t - T.ten) * 5), land = EO(sm(T.ten - 0.05, T.ten + 0.15, t));
      pup(st, {}, (p, g) => {
        p.save(); p.translate(360, 1010); p.scale(lerp(1.6, 1, land) * (1 + hit * 0.12), lerp(1.6, 1, land) * (1 + hit * 0.12));
        p.fillStyle = INK; p.font = `400 220px ${NF}`; p.textAlign = 'center'; p.textBaseline = 'alphabetic'; p.globalAlpha = land; p.fillText('10', 0, 0);
        p.restore();
        if (t > T.ten + 0.25) plaque(p, { x: 360, y: lerp(1300, 1090, EO(sm(T.ten + 0.25, T.ten + 0.5, t))), text: 'bullets per bird', size: 44 });
      });
    }
  }
  // the ending: the soldier marches off; the emus stand on the ridge under a full moon; the final card drops
  function sceneEnd(st, t) {
    const gy = 1120;
    pup(st, {}, (p, g) => moon(p, g, { x: 520, y: 330, r: 90, burst: EO(sm(T.finalCard[1], T.finalCard[1] + 0.4, t)) * 0.8 }));
    pup(st, { blur: 1.2, alpha: 0.9 }, (p) => outback(p, st.W, st.Hh, t, 960));
    pup(st, {}, (p, g, rods) => {
      [[430, 0], [560, 1], [300, 2]].forEach(([x, i]) => emu(p, g, { x, y: gy - 20 - i * 6, s: 0.5 - i * 0.04, flip: i === 1, peck: i === 2 ? 0.5 + 0.5 * Math.sin(t * 3) : 0, blink: blinkAt(t, [30.2 + i * 0.3]) }, rods));
      const u = sm(T.retreat[0], T.retreat[1], t);
      if (u < 1) {
        soldier(p, g, { x: lerp(160, -280, u), y: gy + 10, s: 0.7, walk: 1, ph: t * 9, flip: true, armR: 0.9, armL: 0.2 }, rods);
        lewis(p, g, { x: lerp(160, -280, u) - 40, y: gy - 270, s: 0.4, rot: -0.5, noRods: true }, null);
      }
    });
    if (t > T.finalCard[0]) pup(st, {}, (p, g) => titleCard(p, g, {
      x: 360, y: lerp(-300, 590, EO(sm(T.finalCard[0], T.finalCard[1], t))), w: 600, h: 330, s: 1, rot: swing(t, T.finalCard[1], 0.06, 2.2, 6),
      lines: [{ text: 'Emus 1', size: 84, y: -30, num: true }, { text: 'Army 0', size: 84, y: 78, num: true }],
    }));
  }

  function explainer(ctx, W, Hh, t) {
    const st = begin(W, Hh);
    let b = sm(0, 0.55, t) * (1 - 0.35 * Math.max(0, NZ.n2(t * 23, 3.3)) * (1 - sm(0.35, 0.7, t)));
    b *= 1 - 0.93 * Math.sin(Math.PI * cl((t - T.lampDown1[0]) / (T.lampDown1[1] - T.lampDown1[0])));
    b *= 1 - 0.93 * Math.sin(Math.PI * cl((t - T.lampDown2[0]) / (T.lampDown2[1] - T.lampDown2[0])));
    const flare = t > T.ten ? Math.exp(-(t - T.ten) * 3) * 0.32 : 0;
    lamp(ctx, W, Hh, t, b + flare * 0.3, flare);
    // a red gel slides in front of the lamp while the guns fire, and when one jams
    const red = Math.max(sm(T.fire[0], T.fire[0] + 0.1, t) * (1 - sm(T.fire[1], T.fire[1] + 0.3, t)) * 0.5, sm(T.jam, T.jam + 0.1, t) * (1 - sm(T.jam + 0.5, T.jam + 0.8, t)));
    if (red > 0) { ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(255,70,50,${red * 0.75})`; ctx.fillRect(0, 0, W, Hh); ctx.restore(); }
    if (t < 7.8) { if (t > T.emusIn[0] - 0.4) sceneField(st, t); sceneHook(st, t); }
    else if (t < T.flyAt[0] + 0.5) sceneArmy(st, t);
    else if (t < 19.75) sceneChase(st, t);
    else if (t < 26.8) sceneTally(st, t);
    else sceneEnd(st, t);
    if (t > T.flyAt[0] && t < T.flyAt[1]) flyAt(st, t);
    const s = st.S.getContext('2d');
    s.drawImage(valance(W), 0, 0); s.drawImage(ground(W), 0, Hh - 110);
    if (t < 19.75) gumBranch(st, t, 1, 0.85); else if (t > 26.8) gumBranch(st, t, -1, 0.85);
    const cover = EIO(sm(T.curtains[0], T.curtains[1], t)) * (1 - EIO(sm(T.curtains[2], T.curtains[3], t)));
    if (cover > 0.001) pup(st, {}, (p) => curtains(p, W, Hh, cover, t));
    end(ctx, st, t);
  }

  window.EMU = { explainer, D, T, countEmus, countBullets, countKills, fonts: ['400 132px "Libre Baskerville"', '400 70px "IM Fell English"', 'italic 400 44px "IM Fell English"'] };
})();
</script>
<script>// The sound score for the shadow-play Emu War. Every cue is read from the picture's own beat times (EMU.T) so sound
// and image land on the same frame. Medium-true palette: struck bronze (gamelan), wooden rod taps, hide rustle, the
// lamp's hum; one gong for the key number. Effects in front, hum and room underneath, never more than ~3 at once.
(function () {
  const T = EMU.T, D = EMU.D;
  function scoreSound(k) {
    const when = (f, v, a, b) => { for (let t = a; t <= b; t += 0.001) if (f(t) >= v) return t; return b; };
    // struck bronze: fundamental + a detuned twin (the beat) + soft partials under 2.5 kHz
    const gam = (t, n, g = 1, pan = 0, minor = false) => {
      const f = k.hz(n);
      k.tone(t, { f, dur: 1.9, gain: 0.13 * g, a: 0.002, pan, verb: 0.3, minor });
      k.tone(t, { f: f * 1.007, dur: 1.6, gain: 0.07 * g, a: 0.002, pan, verb: 0.3, minor });
      k.tone(t, { f: f * 2.01, dur: 0.55, gain: 0.04 * g, a: 0.002, pan, minor });
      if (f * 2.95 < 2500) k.tone(t, { f: f * 2.95, dur: 0.22, gain: 0.018 * g, a: 0.002, pan, minor });
      k.noise(t, { dur: 0.02, filter: 'bandpass', f: Math.min(2200, f * 1.6), q: 2, gain: 0.08 * g, pan, minor });
    };
    const gong = (t, g = 1) => {
      k.play('thud', t, { f: 90, gain: 0.7 * g });
      k.tone(t, { f: [[0, 98], [3.6, 95]], dur: 3.6, gain: 0.36 * g, a: 0.012, verb: 0.45 });
      k.tone(t, { f: [[0, 99.2], [3.2, 96]], dur: 3.2, gain: 0.16 * g, a: 0.02 });
      k.tone(t, { f: 202, dur: 2.2, gain: 0.1 * g, a: 0.01, verb: 0.4 });
      k.tone(t, { f: 277, dur: 1.4, gain: 0.05 * g, a: 0.01 });
      k.noise(t, { dur: 0.3, color: 'brown', filter: 'lowpass', f: 450, gain: 0.3 * g });
    };
    const tap = (t, f = 640, g = 0.55, pan = 0, minor = true) => { k.play('tock', t, { f, gain: g, pan, minor }); k.noise(t, { dur: 0.014, filter: 'bandpass', f: 1700, q: 2.5, gain: 0.32 * g, a: 0.001, pan, minor }); };
    const hide = (t, dur, g = 0.5, pan = 0, minor = true) => k.play('paper', t, { dur, gain: g, pan, minor });
    const slide = (t, dur, g = 0.12, minor = true) => k.noise(t, { dur, color: 'brown', filter: 'lowpass', f: [[0, 260], [dur * 0.5, 520], [dur, 240]], gain: g, a: dur * 0.4, minor });
    const flap = (t, g = 0.25, pan = 0, minor = true) => k.noise(t, { dur: 0.11, color: 'pink', filter: 'lowpass', f: [[0, 900], [0.11, 300]], gain: g, a: 0.03, pan, minor });
    const sigh = (t) => k.noise(t, { dur: 0.8, color: 'brown', filter: 'lowpass', f: [[0, 600], [0.4, 140], [0.8, 600]], gain: 0.35, a: 0.05, hold: 0.5 });
    // the Lewis gun as a shadow-theatre effect: a hard wooden clack with a gritty rattle, 12 a second at most
    const burst = (t0, t1, pan = 0) => { for (let t = t0; t < t1; t += 1 / 12) { tap(t, 1350, 0.55, pan, false); k.noise(t, { dur: 0.04, filter: 'bandpass', f: 900, q: 1.2, gain: 0.18, pan }); } };
    // counter ticks: wooden, at most ~11 a second, slowing as the number settles
    const ticks = (f, a, b, pan = 0) => { let last = -1, prev = f(a); for (let t = a; t < b; t += 0.002) { const v = f(t); if (v !== prev && t - last >= 0.09) { tap(t, 1150, 0.36, pan); last = t; } prev = v; } };

    // ---- beds: the lamp's hum and the room
    k.bed('hum', 0.2, D, { gain: 0.5 });
    k.bed('room', 0, D, { gain: 0.7 });
    k.noise(0.04, { dur: 0.45, color: 'brown', filter: 'lowpass', f: [[0, 200], [0.12, 700], [0.45, 180]], gain: 0.4, a: 0.05 });
    [0.18, 0.31, 0.47].forEach((t, i) => k.noise(t, { dur: 0.012, filter: 'bandpass', f: 1300 + i * 300, q: 1.5, gain: 0.12, minor: true }));
    [3.3, 9.6, 15.0, 21.0, 27.9, 30.6].forEach((t, i) => k.noise(t, { dur: 0.01, filter: 'bandpass', f: 1500 + i * 120, q: 1.4, gain: 0.07, minor: true }));

    // ---- 1 HOOK: the title card drops on its strings and lands; hoisted to the top
    hide(0.25, 0.3, 0.7);
    tap(T.cardDrop[1], 520, 0.7, 0, false);
    gam(T.cardDrop[1] + 0.02, 'D4', 1.0);
    slide(T.cardHoist[0], 0.6, 0.14);
    tap(T.cardHoist[1] - 0.03, 700, 0.45, -0.3);

    // ---- 2 THE EMUS: each hops in (landings at u = 1/3, 2/3, 1 of its 0.9 s entry), then the count
    [0, 0.25, 0.5, 0.75, 1.0].forEach((d, i) => {
      const t0 = T.emusIn[0] + d;
      hide(t0, 0.3, 0.35, 0.7);
      [1 / 3, 2 / 3, 1].forEach((u, j) => tap(t0 + 0.9 * u, 380 + i * 25 - j * 20, j === 2 ? 0.55 : 0.4, 0.5));
    });
    hide(T.countEmus[0] - 0.3, 0.25, 0.35);
    tap(T.countEmus[0], 760, 0.5, 0, false);
    ticks(EMU.countEmus, T.countEmus[0] + 0.05, T.countEmus[1] - 0.02);
    gam(T.countEmus[1], 'A4', 0.9);
    k.play('stroke', T.eatPlaque, { material: 'brush', dur: 0.5, gain: 0.7, minor: true });
    tap(T.eatPlaque + 0.5, 820, 0.5, 0.2);

    // ---- 3 THE ARMY: the lamp turned down and up, the soldier slides in, labels drop
    sigh(T.lampDown1[0]);
    slide(T.soldierIn[0], 0.8, 0.16);
    [0.25, 0.5, 0.75].forEach((u) => tap(T.soldierIn[0] + u * 0.8, 300, 0.35, -0.6));
    tap(T.majorPlaque + 0.3, 860, 0.6, 0);
    tap(T.gunTag + 0.25, 640, 0.55, -0.4, false);
    tap(T.roundsBoard[1], 520, 0.6, 0.3, false);
    gam(T.roundsBoard[1] + 0.02, 'A3', 0.8, 0.3);

    // ---- 4 THE SHOOTING: a red gel slides in, the gun clacks, emus scatter, vines split
    k.noise(T.fire[0] - 0.05, { dur: 0.14, filter: 'highpass', f: 1200, gain: 0.08, a: 0.06 });
    burst(T.fire[0], T.fire[1], -0.3);
    [11.6, 11.85, 12.1, 12.35].forEach((t, i) => flap(t, 0.25, i % 2 ? 0.6 : -0.2));
    k.play('stroke', T.splitPlaque - 0.25, { material: 'brush', dur: 0.55, gain: 0.8, minor: true });
    tap(T.splitPlaque + 0.3, 820, 0.6, 0);

    // ---- 5 TRANSITION: an emu runs at the lamp, its shadow fills the screen
    flap(T.flyAt[0] + 0.05, 0.45, 0.3, false); flap(T.flyAt[0] + 0.22, 0.5, 0.1, false);
    k.noise(T.flyAt[0] + 0.1, { dur: 0.75, color: 'pink', filter: 'bandpass', f: [[0, 180], [0.35, 800], [0.75, 160]], q: 0.8, gain: 0.42, a: 0.3, verb: 0.2 });
    k.play('thud', T.flyAt[0] + 0.42, { f: 70, gain: 0.35 });

    // ---- 6 THE CHASE: the truck rumbles, the gun fires on the move, the speed board lands
    k.play('roller', T.truckIn[0], { dur: T.curtains[0] - T.truckIn[0], gain: 0.5, pan: -0.2 });
    burst(T.truckIn[1] + 0.2, 15.4, -0.2);
    tap(T.speedBoard + 0.3, 760, 0.6, 0, false);
    gam(T.speedBoard + 0.32, 'E5', 0.7);
    burst(16.4, T.jam, -0.2);

    // ---- 7 THE JAM: a clunk and a dry click, clashing bronze, smoke puffs, the tag with its X, the lurch
    k.play('thud', T.jam, { f: 200, gain: 0.5, pan: -0.2 });
    k.play('click', T.jam + 0.12, { f: 1500, gain: 0.9, pan: -0.2 });
    gam(T.jam + 0.05, 'Eb4', 0.8); gam(T.jam + 0.05, 'E4', 0.7); gam(T.jam + 0.05, 'A2', 0.9);
    [0.3, 0.55, 0.8].forEach((d) => k.noise(T.jam + d, { dur: 0.25, color: 'pink', filter: 'lowpass', f: 600, gain: 0.08, a: 0.08, pan: -0.2, minor: true }));
    tap(T.jamTag + 0.25, 640, 0.6, -0.3, false);
    k.play('thud', T.lurch, { f: 120, gain: 0.4 });

    // ---- 8 TRANSITION: lace curtains close and part; then the tally boards count
    for (const pan of [-0.7, 0.7]) k.noise(T.curtains[0], { dur: 0.32, color: 'pink', filter: 'bandpass', f: [[0, 500], [0.2, 1500], [0.32, 700]], q: 0.7, gain: 0.25, a: 0.12, pan });
    k.play('thud', T.curtains[1], { f: 110, gain: 0.3 });
    for (const pan of [-0.7, 0.7]) k.noise(T.curtains[2], { dur: 0.36, color: 'pink', filter: 'bandpass', f: [[0, 700], [0.2, 1500], [0.36, 500]], q: 0.7, gain: 0.22, a: 0.12, pan });
    ticks(EMU.countBullets, T.bulletsCount[0] + 0.05, T.bulletsCount[1] - 0.02);
    gam(T.bulletsCount[1], 'D4', 0.8);
    hide(T.killsCount[0] - 0.25, 0.25, 0.35); tap(T.killsCount[0], 520, 0.55, 0, false);
    ticks(EMU.countKills, T.killsCount[0] + 0.05, T.killsCount[1] - 0.02, 0.1);
    gam(T.killsCount[1], 'F4', 0.8);
    k.play('stroke', T.divide[0], { material: 'brush', dur: T.divide[1] - T.divide[0], gain: 0.9, minor: true });

    // ---- 9 THE KEY NUMBER: "10" stamps down, the lamp flares, the gong
    gong(T.ten, 1.1);
    gam(T.ten + 0.02, 'D5', 0.6, 0.3);
    tap(T.ten + 0.5, 820, 0.55, 0);

    // ---- 10 NIGHT: lamp down and up; the soldier marches off left; the emus drum
    sigh(T.lampDown2[0]);
    for (let t = T.retreat[0] + 0.1, i = 0; t < T.retreat[1]; t += 0.35, i++) tap(t, 300, 0.42 * (1 - i / 7), -0.4 - i * 0.07);
    [28.1, 28.5].forEach((t) => k.tone(t, { f: [[0, 70], [0.4, 62]], dur: 0.5, gain: 0.12, a: 0.02, minor: true }));

    // ---- 11 TAKEAWAY: the final card drops; a resolving bronze phrase over a low tone
    hide(T.finalCard[0], 0.3, 0.6);
    tap(T.finalCard[1], 520, 0.8, 0, false);
    gam(T.finalCard[1] + 0.1, 'D4', 0.9, -0.2); gam(T.finalCard[1] + 0.24, 'A4', 0.85, 0); gam(T.finalCard[1] + 0.38, 'D5', 0.8, 0.2);
    k.tone(T.finalCard[1] + 0.1, { f: 'D3', dur: 2.4, gain: 0.12, a: 0.01, verb: 0.4 });
  }
  window.scoreSound = scoreSound;
})();
</script>
<script>
const DURATION = EMU.D; window.DURATION = DURATION;
const cv = document.getElementById('screen'), ctx = cv.getContext('2d');
const playB = document.getElementById('play'), scrub = document.getElementById('scrub'), timeL = document.getElementById('time'), sndB = document.getElementById('snd'), loopB = document.getElementById('loop');
let t = 0, playing = false, t0 = 0, wall0 = 0, soundOn = true, loop = true, stopSound = null, raf = 0;
function draw(tt) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; EMU.explainer(ctx, 720, 1280, tt); }
window.seek = (tt) => { t = Math.max(0, Math.min(DURATION, tt)); draw(t); scrub.value = t; timeL.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)} s`; };
function stopS() { if (stopSound) { stopSound(); stopSound = null; } }
function startS() { stopS(); if (soundOn && playing) stopSound = SOUND.live(window.scoreSound, t, { voiceover: false }); }
function tick() {
  if (!playing) return;
  let tt = t0 + (performance.now() - wall0) / 1000;
  if (tt >= DURATION) { if (loop) { t0 = 0; wall0 = performance.now(); tt = 0; window.seek(0); startS(); } else { window.seek(DURATION); pause(); return; } }
  window.seek(tt); raf = requestAnimationFrame(tick);
}
function play() { if (t >= DURATION - 0.01) t = 0; playing = true; t0 = t; wall0 = performance.now(); playB.textContent = 'Pause'; startS(); raf = requestAnimationFrame(tick); }
function pause() { playing = false; cancelAnimationFrame(raf); stopS(); playB.textContent = 'Play'; }
playB.onclick = () => (playing ? pause() : play());
scrub.oninput = () => { const was = playing; if (was) { playing = false; cancelAnimationFrame(raf); stopS(); } window.seek(+scrub.value); if (was) play(); };
sndB.onclick = () => { soundOn = !soundOn; sndB.setAttribute('aria-pressed', soundOn); if (!soundOn) stopS(); else startS(); };
loopB.onclick = () => { loop = !loop; loopB.setAttribute('aria-pressed', loop); };
(async () => { try { await Promise.all(EMU.fonts.map((f) => document.fonts.load(f, 'AaZz09'))); await document.fonts.ready; } catch (e) {} window.seek(1.7); window.__ready = true; })();
</script>
