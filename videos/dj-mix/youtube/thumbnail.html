<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-400.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/Inter-700.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
  .bg { position: absolute; left: 60px; top: -150px; width: 1620px; height: 911px; background: url("bg.png") center / cover; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 0%, #000 30%, rgba(0,0,0,0) 58%); }
  .k { position: absolute; left: 64px; top: 150px; font-family: "Inter"; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; color: #FF5A1F; }
  .t { position: absolute; left: 58px; top: 196px; font-family: "Archivo Black"; font-size: 170px; line-height: 0.92; color: #fff; }
  .bar { position: absolute; left: 64px; top: 528px; width: 300px; height: 10px; background: #FF5A1F; }
  .s { position: absolute; left: 64px; top: 562px; font-family: "Inter"; font-weight: 700; font-size: 30px; color: #e9e9ef; line-height: 1.3; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="fade"></div>
  <div class="k">LIVE BLEND · 126 BPM</div>
  <div class="t">DJ<br>MIX</div>
  <div class="bar"></div>
  <div class="s">Bajo Pesado × Controlled Groove</div>
</body>
</html>
