name: Wild Africa photos

# Fetches the Wikimedia Commons photos for videos/wild-africa-hippo on a GitHub runner (the cloud sandbox's shared IP
# is rate-limited by Commons) and commits them, with their credits, back to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "videos/wild-africa-hippo/scripts/photos.py"
      - ".github/workflows/wild-africa-photos.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: videos/wild-africa-hippo
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u scripts/photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add public/photos src/credits.json
          git diff --cached --quiet || git commit -m "Wild Africa: fetch Commons photos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
